<rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">Abb. 2.8</text>
<line x1="28" y1="52" x2="772" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="60" y="130" width="220" height="110" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="170" y="190.6" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">1. Absetzen</text><text x="170" y="268" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">24 h stehen lassen – Schlamm sinkt zu Boden</text><line x1="280" y1="185" x2="310" y2="185" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="310" y="130" width="220" height="110" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="420" y="190.6" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">2. Tuch / Sieb</text><text x="420" y="268" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">vorsichtig abgießen, durch Tuch seihen</text><line x1="530" y1="185" x2="560" y2="185" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="560" y="130" width="220" height="110" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="670" y="190.6" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">3. Aktivkohle</text><text x="670" y="268" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Schicht Kohle – Geruch/Geschmack bindet</text><rect x="80" y="330" width="180" height="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><rect x="80" y="390" width="180" height="30" fill="url(#dots)" stroke="none"/><text x="170" y="318" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Trübwasser</text><line x1="270" y1="375" x2="330" y2="375" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="340" y="330" width="180" height="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><path d="M340 360 L520 390" fill="url(#cross)" stroke="#1a1a1a" stroke-width="2"/><text x="430" y="318" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">geklärt – noch nicht trinkbar!</text><line x1="530" y1="375" x2="600" y2="375" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="80" y="450" width="640" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="476.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Klären entfernt keine Keime und keine Chemie – danach immer abkochen/desinfizieren (Abb. 2.9/2.13)</text>
<line x1="28" y1="472" x2="772" y2="472" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="494" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Klären / Vorfiltern in drei Stufen: absetzen lassen, Tuch/Sieb, Aktivkohle (Konzept 6.1).</text>
