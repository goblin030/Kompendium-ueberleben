<rect x="90" y="170" width="150" height="210" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="3" rx="20"/><rect x="110" y="144" width="110" height="34" fill="#c9c9c9" stroke="#1a1a1a" stroke-width="2" rx="12"/><text x="165" y="400" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">72 h – Notfallrucksack</text><text x="165" y="420" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a">&lt; 12 kg</text><text x="165" y="440" font-family="sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#4d4d4d">6 l Wasser, 6.000–9.000 kcal, Medis 7+ T</text><rect x="320" y="120" width="190" height="260" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="3" rx="20"/><rect x="340" y="94" width="150" height="34" fill="#c9c9c9" stroke="#1a1a1a" stroke-width="2" rx="12"/><text x="415" y="400" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">7 Tage – Marschrucksack</text><text x="415" y="420" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a">≤ 15–20 % KG</text><text x="415" y="440" font-family="sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#4d4d4d">Zelt/Tarp, Schlafsack, Kocher, Vorrat 7 T</text><rect x="550" y="230" width="110" height="150" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="3" rx="20"/><rect x="570" y="204" width="70" height="34" fill="#c9c9c9" stroke="#1a1a1a" stroke-width="2" rx="12"/><text x="605" y="400" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Kind / Senior</text><text x="605" y="420" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a">10–15 % KG</text><text x="605" y="440" font-family="sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#4d4d4d">eigenes Päckchen, Pfeife außen, Leuchtstreifen</text><rect x="90" y="450" width="620" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="476.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Je länger der Einsatz, desto mehr Gewicht – deshalb Traglast-Regel (W20, Abb. 1.23) je Person neu rechnen</text>
