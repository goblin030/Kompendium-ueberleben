<rect x="60" y="90" width="680" height="80" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><line x1="100" y1="146" x2="100" y2="147.2" stroke="#1a1a1a" stroke-width="3"/><circle cx="100" cy="145.2" r="1" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><circle cx="99.4" cy="145.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="100.6" cy="145.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="140" y="120" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Wegerich</text><text x="300" y="120" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Blätter auf Wunden (Ziehen)</text><text x="140" y="146" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#4d4d4d">frisch, sauber</text><rect x="60" y="182" width="680" height="80" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><line x1="100" y1="238" x2="100" y2="239.2" stroke="#1a1a1a" stroke-width="3"/><circle cx="100" cy="237.2" r="1" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><circle cx="99.4" cy="237.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="100.6" cy="237.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="140" y="212" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Brennnessel</text><text x="300" y="212" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Aufguss, Eisenlieferant</text><text x="140" y="238" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#4d4d4d">Handschuhe beim Pflücken</text><rect x="60" y="274" width="680" height="80" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><line x1="100" y1="330" x2="100" y2="331.2" stroke="#1a1a1a" stroke-width="3"/><circle cx="100" cy="329.2" r="1" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><circle cx="99.4" cy="329.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="100.6" cy="329.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="140" y="304" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Kamille</text><text x="300" y="304" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Aufguss: Haut, Magen</text><text x="140" y="330" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#4d4d4d">nicht bei Korbblütler-Allergie</text><rect x="60" y="366" width="680" height="80" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><line x1="100" y1="422" x2="100" y2="423.2" stroke="#1a1a1a" stroke-width="3"/><circle cx="100" cy="421.2" r="1" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><circle cx="99.4" cy="421.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="100.6" cy="421.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="140" y="396" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Beinwell</text><text x="300" y="396" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">NUR äußerlich, intakte Haut</text><text x="140" y="422" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#4d4d4d">Pyrrolizidinalkaloide (EMA/HMPC) – nie innerlich, nie auf offene Wunden</text><rect x="60" y="458" width="680" height="80" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><line x1="100" y1="514" x2="100" y2="515.2" stroke="#1a1a1a" stroke-width="3"/><circle cx="100" cy="513.2" r="1" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><circle cx="99.4" cy="513.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="100.6" cy="513.7" r="0.6" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="140" y="488" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Weidenrinde</text><text x="300" y="488" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Schmerz/Fieber (Salicyl)</text><text x="140" y="514" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#4d4d4d">NICHT unter 16 Jahren (Reye-Syndrom, B8 7.3)</text><rect x="60" y="562" width="680" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="588.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">fachlektorische Korrektur übernommen: Grenzen sind Bestandteil der Abbildung – „erst die Grenze, dann die Gabe“ (6.2)</text>
