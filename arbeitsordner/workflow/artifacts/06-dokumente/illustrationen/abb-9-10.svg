<rect x="200" y="160" width="400" height="220" fill="#c19a6b" stroke="#1a1a1a" stroke-width="3"/><rect x="210" y="176" width="380" height="60" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="211" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Schicht 3 (oben): häufig gebraucht – Messer, Zange, Schraubendreher</text><rect x="210" y="246" width="380" height="60" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="281" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Schicht 2: mittel – Säge, Hammer, Feilen</text><rect x="210" y="316" width="380" height="60" fill="#6e6e6e" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="351" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#ffffff">Schicht 1 (unten): schwer &amp; selten – Bohrer, Ersatzklingen, Nägel</text><line x1="180" y1="160" x2="192" y2="160" stroke="#1a1a1a" stroke-width="1"/><line x1="180" y1="380" x2="192" y2="380" stroke="#1a1a1a" stroke-width="1"/><line x1="186" y1="160" x2="186" y2="380" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/><text x="174" y="270" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#1a1a1a">3 Schichten</text><rect x="90" y="420" width="620" height="56" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="452.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Gewicht: ≤ ¼ Körpergewicht (z. B. 70 kg → ≤ 17,5 kg) – Kiste immer tragbar, nie schleppen · Inventarliste innen im Deckel</text>
