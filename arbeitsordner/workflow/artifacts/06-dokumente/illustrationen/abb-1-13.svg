t-anchor="middle" font-weight="normal" fill="#1a1a1a">Signal 1</text><circle cx="320" cy="180" r="12" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><text x="320" y="158" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Signal 2</text><circle cx="500" cy="180" r="12" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><text x="500" y="158" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Signal 3</text><line x1="100" y1="260" x2="700" y2="260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><text x="400" y="250" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">wiederholen bis Antwort oder 1 Minute um</text><rect x="70" y="320" width="160" height="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="150" y="360.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Pfeife</text><text x="150" y="380.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a">3× laut</text><rect x="250" y="320" width="160" height="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="330" y="360.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Licht</text><text x="330" y="380.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a">3× Blitz</text><rect x="430" y="320" width="160" height="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="510" y="360.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Rauch/Feuer</text><text x="510" y="380.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a">3 Feuer im Dreieck</text><rect x="610" y="320" width="160" height="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="690" y="360.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Spiegel</text><text x="690" y="380.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1a1a1a">3× Blitz zum Ziel</text><rect x="70" y="440" width="660" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="466.725" font-family="sans-serif" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">International: 3 × irgendetwas = Not; alles andere kann Zufall sein</text>
