<?xml version="1.0" encoding="UTF-8"?>
<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Abb. 2.11 – Langsamsandfilter: Sand 40–60 cm, Wasserstand ≥ 5 cm über Sand, Reife 1–2 Wochen, Filtrat nachkochen (Konzept 7.1).">
<title>Abb. 2.11: Langsamsandfilter: Sand 40–60 cm, Wasserstand ≥ 5 cm über Sand, Reife 1–2 Wochen, Filtrat nachkochen (Konzept 7.1).</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#8c8c8c" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#bfbfbf" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#8c8c8c"/></pattern>
</defs>
<rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">Abb. 2.11</text>
<line x1="28" y1="52" x2="772" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="280" y="100" width="240" height="340" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="3"/><rect x="280" y="140" width="240" height="24" fill="url(#dots)" stroke="#1a1a1a" stroke-width="0"/><text x="400" y="132" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Wasserstand ≥ 5 cm über Sand</text><rect x="280" y="164" width="240" height="200" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="0"/><text x="400" y="270" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Sand 40–60 cm</text><rect x="280" y="364" width="240" height="40" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="0"/><text x="400" y="388" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Kies 10–15 cm</text><rect x="280" y="404" width="240" height="36" fill="#7a7a7a" stroke="#1a1a1a" stroke-width="0"/><text x="400" y="427" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#ffffff">Auslauf</text><text x="400" y="90" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Zulauf (geklärtes Rohwasser)</text><line x1="400" y1="96" x2="400" y2="128" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/><text x="560" y="160" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Schmutzdecke (Biohaut)</text><line x1="556" y1="166" x2="500" y2="170" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/><text x="560" y="200" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wartung: oberste 0,5–1 cm</text><text x="560" y="216" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Sand abschaben</text><rect x="90" y="470" width="620" height="56" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="502.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Reifezeit 1–2 Wochen, danach Filtrat trotzdem abkochen – Biohaut nicht essen/trinken</text>
<line x1="28" y1="512" x2="772" y2="512" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="534" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Langsamsandfilter: Sand 40–60 cm, Wasserstand ≥ 5 cm über Sand, Reife 1–2 Wochen, Filtrat nachkochen (Konzept 7.1).</text>
<text x="772" y="534" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Band 2</text>
