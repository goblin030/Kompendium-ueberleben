<line x1="28" y1="52" x2="772" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="400" y="86" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wie gehe ich mit Fledermäusen um (EBLV-Lyssaviren)?</text><rect x="55" y="112" width="330" height="118" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="81" cy="138" r="15" fill="#1a1a1a" stroke="none"/><text x="81" y="143" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="105" y="146" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Nie mit bloßen Händen anfassen — weder lebende</text><text x="105" y="163" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">noch tote Fledermäuse (RKI: Fledermäuse sind </text><line x1="393" y1="171" x2="477" y2="171" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="485" y="112" width="330" height="118" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="511" cy="138" r="15" fill="#1a1a1a" stroke="none"/><text x="511" y="143" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="535" y="146" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Quartierfund (Dachboden, Keller, Wald):</text><text x="535" y="163" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Abstand halten, Tiere in Ruhe lassen, Fund der</text><text x="535" y="180" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">zustä</text><line x1="650" y1="234" x2="650" y2="254" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="55" y="260" width="330" height="118" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="81" cy="286" r="15" fill="#1a1a1a" stroke="none"/><text x="81" y="291" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="105" y="294" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Verhaltensauffälliges Tier (tagsüber aktiv,</text><text x="105" y="311" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">flugunfähig am Boden, aggressiv): meiden,</text><text x="105" y="328" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">nicht </text><line x1="393" y1="319" x2="477" y2="319" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="485" y="260" width="330" height="118" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="511" cy="286" r="15" fill="#1a1a1a" stroke="none"/><text x="511" y="291" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="535" y="294" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Biss oder Kratzer (auch vermeintlich harmlos):</text><text x="535" y="311" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wunde sofort und ausgiebig mit Wasser und Sei</text><line x1="650" y1="382" x2="650" y2="402" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="55" y="408" width="330" height="118" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="81" cy="434" r="15" fill="#1a1a1a" stroke="none"/><text x="81" y="439" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text><text x="105" y="442" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Impfausweis dokumentieren; Impfstatus prüfen</text><text x="105" y="459" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">(Tetanus-Auffrischung siehe ART-0234/0245).</text>
<line x1="28" y1="552" x2="772" y2="552" stroke="#1a1a1a" stroke-width="1"/>
