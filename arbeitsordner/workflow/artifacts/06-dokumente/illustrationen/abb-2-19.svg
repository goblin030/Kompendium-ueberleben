ext-anchor="middle" font-weight="normal" fill="#1a1a1a">Abort-Eimer mit Deckel</text><line x1="730" y1="360" x2="765" y2="360" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ah)"/><text x="747" y="350" font-family="sans-serif" font-size="1" text-anchor="start" font-weight="normal" fill="#1a1a1a"></text><text x="730" y="470" font-family="sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#4d4d4d">täglich ausbringen, zuschütten</text><path d="M120 136.4 C 122.28 139.52 121.56 141.68 120 142.28 C 118.44 141.68 117.72 139.52 120 136.4 Z" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="120" y="120" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wasserquelle (oben)</text><line x1="140" y1="90" x2="140" y2="102" stroke="#1a1a1a" stroke-width="1"/><line x1="700" y1="90" x2="700" y2="102" stroke="#1a1a1a" stroke-width="1"/><line x1="140" y1="96" x2="700" y2="96" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/><text x="420" y="85" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">alle Varianten: ≥ 30 m, besser 50 m, hangabwärts </text><rect x="40" y="480" width="820" height="46" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="507.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Nie hangaufwärts der Quelle · nie in Senken (Sickerwasser) · Hände waschen mit eigenem Wasser · bei Frost: Eimer-Variante</text>
