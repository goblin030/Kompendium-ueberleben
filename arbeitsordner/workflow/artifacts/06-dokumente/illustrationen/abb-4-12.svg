<rect x="80" y="120" width="210" height="200" fill="#949494" stroke="#1a1a1a" stroke-width="2.5"/><text x="185" y="160" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wolle</text><text x="185" y="195" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">wärmt auch feucht</text><text x="185" y="220" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">bevorzugt innen &amp; außen</text><rect x="320" y="120" width="210" height="200" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2.5"/><text x="425" y="160" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Baumwolle</text><text x="425" y="195" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">kühlt nass – trocknet langsam</text><text x="425" y="220" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">nur bei Trockenheit innen</text><rect x="560" y="120" width="210" height="200" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/><text x="665" y="160" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Synthetik</text><text x="665" y="195" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">schmilzt am Funken (B3) – Loch!</text><text x="665" y="220" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">nie direkt ans Feuer</text><path d="M665 267.06 C 666.82 268.74 666.26 270.28 665 270.91 C 663.74 270.28 663.18 268.74 665 267.06 Z" fill="#e07b39" stroke="#1a1a1a" stroke-width="2"/><path d="M665 268.74 C 665.77 269.65 665.56 270.42 665 270.7 C 664.44 270.42 664.23 269.65 665 268.74 Z" fill="#f6e3d3" stroke="#1a1a1a" stroke-width="1.5"/><text x="665" y="300" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Funke → Schmelzloch</text><rect x="80" y="380" width="640" height="56" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="412.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Pflege: lüften statt waschen, Wolle fettet nach (Lanolin) – Baumwolle kochfest, aber schwer wenn nass</text><rect x="80" y="448" width="640" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="474.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Nadel &amp; Faden: 2 Nadeln, 10–15 m Zwirn im Nähset (Konzept 7.2, konsistent B5 Faserertrag)</text>
