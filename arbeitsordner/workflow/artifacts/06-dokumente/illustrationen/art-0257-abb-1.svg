<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="ART-0257 · Abb. 1 – ART-0257 – Schrittfolge: Wie betreibe ich ein Schmiede-Feuer?">
<title>ART-0257 · Abb. 1: ART-0257 – Schrittfolge: Wie betreibe ich ein Schmiede-Feuer?</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#6e6e6e" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#8a8a8a" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#6e6e6e"/></pattern>
<pattern id="wtr" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#6b97bd"/><path d="M0 8 q 6 -5 12 0 t 12 0" fill="none" stroke="#3f6f96" stroke-width="1.4"/></pattern>
</defs>
<rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">ART-0257 · Abb. 1</text>
<line x1="28" y1="52" x2="772" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="400" y="86" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wie betreibe ich ein Schmiede-Feuer?</text><rect x="55" y="112" width="330" height="118" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="81" cy="138" r="15" fill="#1a1a1a" stroke="none"/><text x="81" y="143" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="105" y="146" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Standort: nur im Freien oder mit Abzug; nie in</text><text x="105" y="163" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">geschlossenen Räumen. Funkenflug-Boden Sand/B</text><line x1="393" y1="171" x2="477" y2="171" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="485" y="112" width="330" height="118" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="511" cy="138" r="15" fill="#1a1a1a" stroke="none"/><text x="511" y="143" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="535" y="146" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kohlebett aufbauen, Luftzufuhr von unten</text><text x="535" y="163" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">(Gebläse/Blasebalg); weiße Glut in der Mitte.</text><line x1="650" y1="234" x2="650" y2="254" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="55" y="260" width="330" height="118" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="81" cy="286" r="15" fill="#1a1a1a" stroke="none"/><text x="81" y="291" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="105" y="294" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Eisen einbringen: auf Schmiedetemperatur</text><text x="105" y="311" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">gelb-weiß erhitzen (900–1.200 °C; Glutkern</text><text x="105" y="328" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">~1.200 °</text><line x1="393" y1="319" x2="477" y2="319" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="485" y="260" width="330" height="118" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="511" cy="286" r="15" fill="#1a1a1a" stroke="none"/><text x="511" y="291" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="535" y="294" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Farbe lesen: immer im Halbdunkel — im Hellen</text><text x="535" y="311" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">wird das Eisen um eine ganze Farbe</text><text x="535" y="328" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">überschätzt.</text><line x1="650" y1="382" x2="650" y2="402" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="55" y="408" width="330" height="118" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2" rx="8"/><circle cx="81" cy="434" r="15" fill="#1a1a1a" stroke="none"/><text x="81" y="439" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text><text x="105" y="442" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Arbeiten: kurze Schläge, Werkstück wandern</text><text x="105" y="459" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">lassen im Feuer, nicht liegen lassen.</text>
<line x1="28" y1="552" x2="772" y2="552" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="574" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">ART-0257 – Schrittfolge: Wie betreibe ich ein Schmiede-Feuer?</text>
<text x="772" y="574" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch</text>
</svg>