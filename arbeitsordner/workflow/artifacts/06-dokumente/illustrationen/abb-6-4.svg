ill="#1a1a1a">Bogenjagd in DE/AT/CH</text><text x="640" y="151.85" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">als Jagd unzulässig –</text><text x="640" y="167.85" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">nur Übungsgerät + Hinweis</text><rect x="90" y="450" width="620" height="50" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="479.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">100 Probeschüsse Pflicht vor dem Ernstfall · Pfeil immer auf Scheibe/Löschfang richten</text>
