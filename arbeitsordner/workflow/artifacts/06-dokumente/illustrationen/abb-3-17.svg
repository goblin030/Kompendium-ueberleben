<circle cx="180" cy="240" r="70" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5"/><path d="M180 170 L180 240 L150 220 Z" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><text x="180" y="240" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1a1a1a">60</text><text x="180" y="340" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Sekunden-Entscheidung</text><rect x="300" y="150" width="220" height="76" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="410" y="183.625" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">1. Klein halten</text><text x="410" y="201.125" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">früh entdeckt = klein</text><rect x="540" y="150" width="220" height="76" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="650" y="183.625" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">2. Ersticken</text><text x="650" y="201.125" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Luft abdecken (Decke, Sand)</text><rect x="300" y="250" width="220" height="76" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="410" y="283.625" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">3. Ausschlagen</text><text x="410" y="301.125" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Rand nach innen schlagen</text><rect x="540" y="250" width="220" height="76" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="650" y="283.625" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">4. Wasser</text><text x="650" y="301.125" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">nur wenn genug – sonst ausbreiten!</text><rect x="300" y="380" width="460" height="50" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="530" y="409.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Zu spät/groß: Rückzug, alarmieren (3 Signale, Abb. 1.13) – nie Helden spielen</text>
