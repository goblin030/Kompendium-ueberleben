-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Daumenbreite</text><text x="256" y="427.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">≈ 2,5 cm</text><text x="456" y="427.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">an Balken prüfen</text><text x="96" y="453.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Handspanne</text><text x="256" y="453.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">≈ 20 cm</text><text x="456" y="453.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">täglich neu greifen</text><text x="96" y="479.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Elle</text><text x="256" y="479.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">≈ 45 cm</text><text x="456" y="479.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Unterarm abmessen</text><text x="96" y="505.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Schritt</text><text x="256" y="505.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">≈ 75 cm</text><text x="456" y="505.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Schrittfehler &lt; 10 %</text>
