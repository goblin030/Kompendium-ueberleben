<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="Abb. 7.7 – Einkochen korrigiert (ROT-1/Gate G-2, warn-7b, W13): pH messen – Wasserbad nur pH ≤ 4,6, low-acid nur Druckkocher 116–121 °C (Konzept 6.2k, NCHFP).">
<title>Abb. 7.7: Einkochen korrigiert (ROT-1/Gate G-2, warn-7b, W13): pH messen – Wasserbad nur pH ≤ 4,6, low-acid nur Druckkocher 116–121 °C (Konzept 6.2k, NCHFP).</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#8c8c8c" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#bfbfbf" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#8c8c8c"/></pattern>
</defs>
<rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">Abb. 7.7</text>
<line x1="28" y1="52" x2="872" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="60" y="100" width="240" height="70" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="180" y="139.9" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1a1a1a">pH messen (Streifen/Lackmus)</text><line x1="300" y1="135" x2="360" y2="135" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="360" y="90" width="220" height="60" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="470" y="124.55" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a">pH ≤ 4,6 (sauer/Obst)</text><rect x="360" y="170" width="220" height="60" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="470" y="204.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">pH &gt; 4,6 (low-acid: Fleisch, Gemüse, Bohnen)</text><line x1="300" y1="160" x2="350" y2="120" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><line x1="300" y1="190" x2="350" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="620" y="80" width="240" height="80" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="740" y="107.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Wasserbad 100 °C</text><text x="740" y="124.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">nur bei pH ≤ 4,6 (gemessen!)</text><text x="740" y="141.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Zeiten nach NCHFP</text><rect x="620" y="180" width="240" height="110" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="740" y="213.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">DRUCK KOCHER Pflicht:</text><text x="740" y="230.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">116–121 °C · 10 psi bis 300 m,</text><text x="740" y="247.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">15 psi darüber · Zeiten NCHFP</text><text x="740" y="264.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">NICHT Wasserbad (max 100 °C)!</text><line x1="580" y1="120" x2="610" y2="115" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><line x1="580" y1="205" x2="610" y2="230" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="280" width="380" height="60" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="250" y="314.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Öl-Einlagen: nur gesäuert (pH &lt; 4,6) oder vollständig getrocknet – kühl, Frist in Tagen</text><rect x="60" y="356" width="380" height="60" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="250" y="390.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">GEFAHR: gewölbter Deckel oder Schwall beim Öffnen = ungeöffnet wegwerfen (Botulismus!)</text><rect x="480" y="330" width="380" height="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="670" y="362.525" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Kaltgeräucherter Fisch: Typ E –</text><text x="670" y="379.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">zusätzlich salzen/trocknen oder kühlen</text><text x="670" y="395.525" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">(09 §2.1) · immer pH dokumentieren</text><rect x="60" y="460" width="800" height="90" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="460" y="500.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">ROT-1-Korrektur (W13, 09 §2.1 wörtlich): Wasserbad erreicht max. 100 °C und tötet C.-botulinum-Sporen NICHT. Low-acid (pH &gt; 4,6) braucht Druckkocher 116–121 °C,</text><text x="460" y="517.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Zeiten nach USDA/NCHFP. Wasserbad nur für Obst/saure Einlagen mit gemessenem pH ≤ 4,6. Warnrahmen + warn-7b Pflicht (nach Gate G-2 grün).</text>
<line x1="28" y1="572" x2="872" y2="572" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="594" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Einkochen korrigiert (ROT-1/Gate G-2, warn-7b, W13): pH messen – Wasserbad nur pH ≤ 4,6, low-acid nur Druckkocher 116–121 °C (Konzept 6.2k, NCHFP).</text>
<text x="872" y="594" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Band 7</text>
</svg>