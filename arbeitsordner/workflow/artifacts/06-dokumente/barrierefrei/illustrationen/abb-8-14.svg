ly="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">&gt; 10 J / &gt; 5 J bei Risiko (warn-8a)</text><rect x="40" y="470" width="820" height="50" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="499.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Immer: nur gesottenes Wasser (Abb. 2.9) · Impfpass checken · TIG postexpositionell nur ärztlich · Impfstoff 2–8 °C (Kühlkette)</text>
