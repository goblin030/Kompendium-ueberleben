<?xml version="1.0" encoding="UTF-8"?>
<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Abb. 8.10 – Der vergiftete Leib: generell KEIN induziertes Erbrechen – Giftnotruf anrufen, Reste sichern (Konzept 5.2, 09 Nr. 11).">
<title>Abb. 8.10: Der vergiftete Leib: generell KEIN induziertes Erbrechen – Giftnotruf anrufen, Reste sichern (Konzept 5.2, 09 Nr. 11).</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#8c8c8c" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#bfbfbf" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#8c8c8c"/></pattern>
</defs>
<rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">Abb. 8.10</text>
<line x1="28" y1="52" x2="872" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="60" y="110" width="300" height="80" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="210" y="136.875" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Giftnotruf anrufen:</text><text x="210" y="154.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">116 123 (DE) · +353 1 809 2166 (IE)</text><text x="210" y="171.875" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">112 (EU-weit)</text><line x1="370" y1="150" x2="430" y2="150" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="440" y="110" width="400" height="80" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="640" y="154.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">KEIN induziertes Erbrechen (auch nicht Salzwasser/Finger) – Ausnahme nur nach telefonischer Rücksprache Giftnotruf</text><rect x="60" y="230" width="380" height="70" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="250" y="269.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Aktivkohle nur nach Rücksprache mit Giftnotruf · Reste sichern (was, wann, wie viel)</text><rect x="480" y="230" width="360" height="70" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="660" y="269.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Bewusstsein beobachten · Atemwege frei · stabile Seitenlage bei Bewusstlosigkeit</text><rect x="60" y="340" width="780" height="70" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="379.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Vergiftungen erkennen (5.1): Pflanzen/Pilze/Speisen/Tiere mit Fristen · B5 2.2 (warn-5) und B5 9.1 (warn-5b) beachten · Giftnotruf-App/Sofortmaßnahme-Karte bereithalten</text>
<line x1="28" y1="472" x2="872" y2="472" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="494" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Der vergiftete Leib: generell KEIN induziertes Erbrechen – Giftnotruf anrufen, Reste sichern (Konzept 5.2, 09 Nr. 11).</text>
<text x="872" y="494" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Band 8</text>
