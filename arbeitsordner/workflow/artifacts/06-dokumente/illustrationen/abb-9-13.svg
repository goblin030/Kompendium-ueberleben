<rect x="240" y="130" width="320" height="260" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="3"/><rect x="250" y="146" width="300" height="66" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="184" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">oben: Messer, Zange, Schraubendreher, Feile</text><rect x="250" y="226" width="300" height="66" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="264" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">mitte: Säge, Hammer, Raspel, Wetzstein</text><rect x="250" y="306" width="300" height="66" fill="#6e6e6e" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="344" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#ffffff">unten: Bohrer, Ersatzklingen, Nägel, Dübel (schwer)</text><line x1="220" y1="130" x2="232" y2="130" stroke="#1a1a1a" stroke-width="1"/><line x1="220" y1="390" x2="232" y2="390" stroke="#1a1a1a" stroke-width="1"/><line x1="226" y1="130" x2="226" y2="390" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#ahs)" marker-end="url(#ah)"/><text x="214" y="260" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#1a1a1a">3 Schichten</text><rect x="600" y="160" width="170" height="60" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="685" y="185.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">≤ ¼ KG</text><text x="685" y="205.25" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a"></text><rect x="90" y="430" width="620" height="60" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="464.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Packregel: häufig gebraucht oben, schwer unten – Kiste nie schleppen, immer tragbar · Inventarliste im Deckel · Feld-Werkstatt: nur das Nötigste mitnehmen (8.2)</text>
