<rect x="50" y="100" width="710" height="392" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><line x1="250" y1="100" x2="250" y2="492" stroke="#1a1a1a" stroke-width="1"/><line x1="510" y1="100" x2="510" y2="492" stroke="#1a1a1a" stroke-width="1"/><line x1="670" y1="100" x2="670" y2="492" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="156" x2="760" y2="156" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="212" x2="760" y2="212" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="268" x2="760" y2="268" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="324" x2="760" y2="324" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="380" x2="760" y2="380" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="436" x2="760" y2="436" stroke="#1a1a1a" stroke-width="1"/><text x="56" y="132.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">Weg</text><text x="256" y="132.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">Prinzip</text><text x="516" y="132.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">Haltbarkeit (Richtwert)</text><text x="676" y="132.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">siehe</text><text x="56" y="188.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Trocknen (Dörren)</text><text x="256" y="188.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wasser entziehen</text><text x="516" y="188.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Monate–Jahre</text><text x="676" y="188.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Abb. 7.2</text><text x="56" y="244.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Räuchern</text><text x="256" y="244.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Rauch + Trocknung</text><text x="516" y="244.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wochen–Monate</text><text x="676" y="244.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Abb. 7.3</text><text x="56" y="300.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Salzen / Pökeln</text><text x="256" y="300.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Lake, Wasseraktivität senken</text><text x="516" y="300.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wochen–Monate</text><text x="676" y="300.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Abb. 7.5</text><text x="56" y="356.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Säuern / Einlegen</text><text x="256" y="356.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Milchsäure oder Essig (pH)</text><text x="516" y="356.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wochen–Monate</text><text x="676" y="356.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Abb. 7.6</text><text x="56" y="412.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Einkochen</text><text x="256" y="412.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Hitze + luftdicht (pH-abhängig!)</text><text x="516" y="412.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Monate</text><text x="676" y="412.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Abb. 7.7</text><text x="56" y="468.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kühlen / Lagern</text><text x="256" y="468.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kammer: kühl, trocken, dunkel</text><text x="516" y="468.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Tage–Wochen</text><text x="676" y="468.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Abb. 7.10</text><rect x="50" y="508" width="700" height="50" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="537.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Fünf Feinde (2.1): Wasser · Wärme · Luft · Licht · Gäste – jeder Weg bekämpft mindestens einen</text>
