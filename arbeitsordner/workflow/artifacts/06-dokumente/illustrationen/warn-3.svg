<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Warngrafik warn-3: Kohlenmonoxid (CO): geruchlos, tödlich">
<title>Warngrafik warn-3: Kohlenmonoxid (CO): geruchlos, tödlich</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#8c8c8c" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#bfbfbf" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#8c8c8c"/></pattern>
</defs>
<rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
<rect x="8" y="8" width="784" height="504" fill="none" stroke="#1a1a1a" stroke-width="6"/>
<text x="28" y="42" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">warn-3</text>
<text x="28" y="68" font-family="sans-serif" font-size="19" text-anchor="start" font-weight="bold" fill="#1a1a1a">Kohlenmonoxid (CO): geruchlos, tödlich</text>
<line x1="28" y1="80" x2="772" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M64 100 L112 182 L16 182 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<text x="64" y="168" font-family="sans-serif" font-size="36" text-anchor="middle" font-weight="bold" fill="#1a1a1a">!</text>
<text x="150" y="215" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">KEINE Verbrennung (Ofen, Kocher, Glut) in geschlossenen Räumen – ein Zelt IST ein geschlossener Raum</text>
<text x="150" y="242" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">· Nie über Nacht im Schlafraum betreiben · Zug prüfen (Luftzug spürbar), regelmäßig lüften</text>
<text x="150" y="269" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">· Symptome: Kopfschmerz, Schwindel, Übelkeit – bei MEHREREN Personen zugleich: Alarm!</text>
<text x="150" y="296" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">· Sofort: alle raus, Frischluft, Sperrung bis der Zug geprüft ist · Betroffene überwachen</text>
<line x1="28" y1="472" x2="772" y2="472" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="494" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Warngrafik warn-3 – B3 6.3: keine Verbrennung in geschlossenen Räumen, nie über Nacht (W14).</text>
<text x="772" y="494" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Warngrafik</text>
</svg>