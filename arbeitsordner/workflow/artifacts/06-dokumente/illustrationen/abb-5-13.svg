<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">Abb. 5.13</text>
<line x1="28" y1="52" x2="872" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="40" y="90" width="820" height="60" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="124.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Sicher: 1. Knoblauchgeruch beim Zerreiben 2. zwei breite, lanzettliche Blätter an der Basis 3. keine Blütezeit-Verwechslung im Frühjahr (weiße Sternblüte)</text><rect x="40" y="170" width="820" height="62" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="60" y="196" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Bärlauch</text><text x="240" y="196" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">ESSBAR</text><text x="400" y="196" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">2–3 breite Blätter, deutlicher Knoblauchgeruch, Unterseite matt</text><text x="60" y="218" font-family="sans-serif" font-size="1" text-anchor="start" font-weight="normal" fill="#1a1a1a"></text><rect x="40" y="246" width="820" height="62" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="60" y="272" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Maiglöckchen</text><text x="240" y="272" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">GIFTIG</text><text x="400" y="272" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">2 glänzende Blätter, KEIN Geruch, weiße Glockenblüten</text><text x="60" y="294" font-family="sans-serif" font-size="1" text-anchor="start" font-weight="normal" fill="#1a1a1a"></text><rect x="40" y="322" width="820" height="62" fill="url(#cross)" stroke="#1a1a1a" stroke-width="2"/><text x="60" y="348" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Aronstab</text><text x="240" y="348" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">GIFTIG</text><text x="400" y="348" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">pfeilförmige Blätter, Beere rot – kein Knoblauchgeruch</text><text x="60" y="370" font-family="sans-serif" font-size="1" text-anchor="start" font-weight="normal" fill="#1a1a1a"></text><rect x="40" y="398" width="820" height="62" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="60" y="424" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Herbstzeitlose</text><text x="240" y="424" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">GIFTIG (Colchicin!)</text><text x="400" y="424" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">im Herbst breite Blätter ohne Geruch – Blüte erst nach dem Blatt</text><text x="60" y="446" font-family="sans-serif" font-size="1" text-anchor="start" font-weight="normal" fill="#1a1a1a"></text><rect x="40" y="488" width="820" height="50" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="517.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">„Keine Mahlzeit ohne Namen + zweites Merkmal“ – im Zweifel stehen lassen · Verwechslungs-Paare komplett: Abb. 5.2 · warn-5</text>
