" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="440.625" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Korrektur: 20–30 m reichen nicht (Sphere ≥ 30 m, WHO 50 m) · Grabtiefe 25–30 cm ist eine andere Größe</text><text x="400" y="458.125" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">als der Abstand – beides gilt (Glossar B1 Anhang D) · nach jedem Gebrauch zuschütten, Hände waschen mit eigenem Wasser</text>
