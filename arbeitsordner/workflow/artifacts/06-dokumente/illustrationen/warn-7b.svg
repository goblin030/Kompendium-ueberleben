<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-label="Warngrafik warn-7b: Botulismus: Sporen überleben 100 °C!">
<title>Warngrafik warn-7b: Botulismus: Sporen überleben 100 °C!</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#8c8c8c" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#bfbfbf" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#8c8c8c"/></pattern>
</defs>
<rect x="0" y="0" width="800" height="620" fill="#ffffff"/>
<rect x="8" y="8" width="784" height="604" fill="none" stroke="#1a1a1a" stroke-width="6"/>
<text x="28" y="42" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">warn-7b</text>
<text x="28" y="68" font-family="sans-serif" font-size="19" text-anchor="start" font-weight="bold" fill="#1a1a1a">Botulismus: Sporen überleben 100 °C!</text>
<line x1="28" y1="80" x2="772" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M64 100 L112 182 L16 182 z" fill="#ffffff" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
<text x="64" y="168" font-family="sans-serif" font-size="36" text-anchor="middle" font-weight="bold" fill="#1a1a1a">!</text>
<text x="150" y="205" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wasserbad (max. 100 °C) tötet C.-botulinum-Sporen NICHT – low-acid (pH &gt; 4,6: Fleisch, Gemüse, Bohnen) nur im DRUCK KOCHER bei 116–121 °C</text>
<text x="150" y="235" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">· 10 psi bis 300 m Höhe, darüber 15 psi · Zeiten nach USDA/NCHFP · pH messen! Wasserbad nur bei pH ≤ 4,6 (Obst/sauer)</text>
<text x="150" y="265" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">· Öl-Einlagen nur gesäuert (pH &lt; 4,6) oder vollständig getrocknet, kühl, Frist in Tagen · kaltgeräucherter Fisch = Typ E (zusätzlich salzen/trocknen)</text>
<text x="150" y="295" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">· GEFAHRZEICHEN: gewölbter Deckel oder Schwall beim Öffnen = ungeöffnet WEGWERFEN · Symptome: Lähmung, Sehstörung – Giftnotruf 116 123, Notarzt!</text>
<line x1="28" y1="572" x2="772" y2="572" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="594" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Warngrafik warn-7b – B7 6.2k (ROT-1, Gate G-2, W13, 09 §2.1): Druckkocher-Pflicht für low-acid.</text>
<text x="772" y="594" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Warngrafik</text>
</svg>