<rect x="60" y="100" width="630" height="260" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><line x1="240" y1="100" x2="240" y2="360" stroke="#1a1a1a" stroke-width="1"/><line x1="570" y1="100" x2="570" y2="360" stroke="#1a1a1a" stroke-width="1"/><line x1="60" y1="152" x2="690" y2="152" stroke="#1a1a1a" stroke-width="1"/><line x1="60" y1="204" x2="690" y2="204" stroke="#1a1a1a" stroke-width="1"/><line x1="60" y1="256" x2="690" y2="256" stroke="#1a1a1a" stroke-width="1"/><line x1="60" y1="308" x2="690" y2="308" stroke="#1a1a1a" stroke-width="1"/><text x="66" y="130.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Wasserzustand</text><text x="246" y="130.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Dosis</text><text x="576" y="130.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Wartezeit</text><text x="66" y="182.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">klar, warm</text><text x="246" y="182.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">2 Tropfen / L (5–6 % Bleiche)</text><text x="576" y="182.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">30 min</text><text x="66" y="234.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">trüb oder kalt</text><text x="246" y="234.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">4 Tropfen / L – doppelt</text><text x="576" y="234.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">60 min</text><text x="66" y="286.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">nach Wartezeit</text><text x="246" y="286.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">leichter Chlorgeruch = ok</text><text x="576" y="286.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Geruchsprobe</text><text x="66" y="338.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kinder</text><text x="246" y="338.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Dosis NICHT halbieren – im Zweifel abkochen</text><text x="576" y="338.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Korrektur</text><rect x="60" y="378" width="400" height="90" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="260" y="418.625" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Nie mischen: Bleiche + Säure oder Ammoniak = Chlorgas (tödlich)</text><text x="260" y="436.125" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">→ Warngrafik warn-2 (Abb. im Warnrahmen)</text><path d="M560 395.8 C 562.66 399.44 561.82 401.96 560 402.66 C 558.18 401.96 557.34 399.44 560 395.8 Z" fill="#6b97bd" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="559.16" cy="400.56" rx="0.48999999999999994" ry="0.84" fill="#ffffff" stroke="none"/><text x="560" y="440" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#1a1a1a">1 Tropfen ≈ 0,05 ml</text><rect x="500" y="460" width="240" height="60" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="620" y="485.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Notstand-Lösung –</text><text x="620" y="502.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">bevorzugt: abkochen (Abb. 2.9)</text>
