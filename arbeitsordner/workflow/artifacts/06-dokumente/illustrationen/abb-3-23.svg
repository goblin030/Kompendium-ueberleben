<line x1="28" y1="52" x2="872" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="40" y="100" width="860" height="434" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><line x1="260" y1="100" x2="260" y2="534" stroke="#1a1a1a" stroke-width="1"/><line x1="640" y1="100" x2="640" y2="534" stroke="#1a1a1a" stroke-width="1"/><line x1="40" y1="162" x2="900" y2="162" stroke="#1a1a1a" stroke-width="1"/><line x1="40" y1="224" x2="900" y2="224" stroke="#1a1a1a" stroke-width="1"/><line x1="40" y1="286" x2="900" y2="286" stroke="#1a1a1a" stroke-width="1"/><line x1="40" y1="348" x2="900" y2="348" stroke="#1a1a1a" stroke-width="1"/><line x1="40" y1="410" x2="900" y2="410" stroke="#1a1a1a" stroke-width="1"/><line x1="40" y1="472" x2="900" y2="472" stroke="#1a1a1a" stroke-width="1"/><text x="46" y="135.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">Situation</text><text x="266" y="135.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">Bester Bau</text><text x="646" y="135.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#1a1a1a">Achtung</text><text x="46" y="197.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wind stark</text><text x="266" y="197.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Sternfeuer (Abb. 3.19) + Steinkreis + Windschutz Platte</text><text x="646" y="197.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Flamme flach halten, Funkenflug (Nadelholz!)</text><text x="46" y="259.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Dauerregen / Nässe</text><text x="266" y="259.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Plattformfeuer (Abb. 3.8) + Zunderkette aus dem Körper (Abb. 3.7)</text><text x="646" y="259.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">trockenes Holz innen am Körper wärmen</text><text x="46" y="321.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kälte, Nacht, wenig Leute</text><text x="266" y="321.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Jägerfeuer (Abb. 3.21) + Banked Fire (Abb. 3.22)</text><text x="646" y="321.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">nie im Zelt, CO (warn-3)</text><text x="46" y="383.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">schnell kochen / ankochen</text><text x="266" y="383.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Tipi-/Pyramide (Abb. 3.20)</text><text x="646" y="383.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">braucht trockenes Kleinholz</text><text x="46" y="445.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">wenig Holz verfügbar</text><text x="266" y="445.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Sternfeuer (Abb. 3.19)</text><text x="646" y="445.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Arme nachschieben, nicht neu aufbauen</text><text x="46" y="507.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Tag, trocken, Gruppe</text><text x="266" y="507.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">offenes Kochfeuer (Abb. 3.9)</text><text x="646" y="507.2" font-family="sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">60-Sekunden-Regel (Abb. 3.17), Feuerwache</text><rect x="40" y="550" width="820" height="50" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="579.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Alle Varianten: 30 cm entkernt, 2–3 m frei, Zelte 4–6 m (Abb. 3.1) · nie unbeaufsichtigt (Abb. 1.3) · CO-Regel gilt immer (warn-3)</text>
