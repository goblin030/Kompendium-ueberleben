="9" ry="7" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="245.4" cy="427.6" rx="9" ry="7" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><text x="230" y="468" font-family="sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a"> herzförmig, paarig (Schalen), keine Nagelspitzen</text><rect x="410" y="310" width="280" height="180" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="550" y="338" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Hase</text><ellipse cx="539" cy="379.2" rx="9" ry="7" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="561" cy="379.2" rx="9" ry="7" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="532.4" cy="432" rx="9" ry="7" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="567.6" cy="432" rx="9" ry="7" fill="#949494" stroke="#1a1a1a" stroke-width="2"/><text x="550" y="468" font-family="sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">lange Hinterläufe (Y-Form), paarige Vorderpfoten</text><rect x="90" y="480" width="620" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="506.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Gangbild: Schrittlänge messen – Trab = gleichmäßig, Flucht = lang &amp; versetzt · Neuschnee datiert die Spur (2.4)</text>
