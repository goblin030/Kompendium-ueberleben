<?xml version="1.0" encoding="UTF-8"?>
<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Abb. 7.9 – Seife aus Resten: 1 Pfund Fett → 1 Pfund Seife, Lauge 0,5 l/Pfund, Reife 4–6 Wochen (Konzept 7.2).">
<title>Abb. 7.9: Seife aus Resten: 1 Pfund Fett → 1 Pfund Seife, Lauge 0,5 l/Pfund, Reife 4–6 Wochen (Konzept 7.2).</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#8c8c8c" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#bfbfbf" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#8c8c8c"/></pattern>
</defs>
<rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">Abb. 7.9</text>
<line x1="28" y1="52" x2="772" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="120" y="220" width="120" height="100" fill="url(#dots)" stroke="#1a1a1a" stroke-width="2.5"/><text x="180" y="210" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Fett 1 Pfund</text><line x1="250" y1="270" x2="330" y2="270" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="290" y="256" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">+ Lauge</text><rect x="340" y="220" width="120" height="100" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><text x="400" y="270" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Seifenleim</text><line x1="470" y1="270" x2="550" y2="270" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="560" y="220" width="140" height="100" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><text x="630" y="258" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Form gießen</text><text x="630" y="276" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Reife 4–6 Wochen</text><rect x="90" y="380" width="620" height="60" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="414.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">1:1-Masseverhältnis (Verseifung, kaum Masseverlust) · Lauge 0,5 l je Pfund Fett (aus Asche, Abb. 3.16) · pH-Test: Zunge darf nicht brennen</text><rect x="90" y="448" width="620" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="474.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Lauge ätzend – Handschuhe, nie einatmen · Seife reift nach: härter &amp; milder mit der Zeit</text>
<line x1="28" y1="472" x2="772" y2="472" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="494" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Seife aus Resten: 1 Pfund Fett → 1 Pfund Seife, Lauge 0,5 l/Pfund, Reife 4–6 Wochen (Konzept 7.2).</text>
<text x="772" y="494" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Band 7</text>
