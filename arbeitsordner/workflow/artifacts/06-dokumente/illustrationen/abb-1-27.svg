 font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Ellbogenprobe: Wasser mit dem Ellbogen prüfen –</text><text x="530" y="153.55" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a">die Haut dort ist so empfindlich wie ein Baby</text><rect x="330" y="190" width="400" height="50" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="530" y="219.55" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Zonen: kalt – lauwarm – heiß – ab 55 °C Verbrühung</text><rect x="330" y="260" width="400" height="56" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="530" y="283.55" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Notbehelf (P = 5): ungenau – Übungspflicht,</text><text x="530" y="301.55" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a">konservativ 55 °C als Grenze </text><rect x="330" y="340" width="400" height="50" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="530" y="369.55" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Im Zweifel kühler lassen – Verbrühung schädigt tiefer als gedacht</text>
