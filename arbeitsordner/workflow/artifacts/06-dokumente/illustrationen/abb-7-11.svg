<rect x="60" y="110" width="220" height="300" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5"/><text x="170" y="146" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">RETten</text><text x="170" y="180" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a">streusalzfreie Trocknung, Umsortieren, Einkochen bei Obst</text><rect x="310" y="110" width="220" height="300" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2.5"/><text x="420" y="146" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">essen (bald)</text><text x="420" y="180" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Geruch/Farbe ok, Schimmel nur oberflächlich bei festem Gut (Käse, Hartwurst – Rand weg)</text><rect x="560" y="110" width="220" height="300" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/><text x="670" y="146" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">WEGWERFEN</text><text x="670" y="180" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a">verschimmeltes Korn/Brot/Nüsse – Mykotoxine ziehen durch · aufgeblähte Konserven · gewölbter Deckel</text><rect x="60" y="440" width="680" height="60" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="474.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Faustregel: im Zweifel wegwerfen – eine Lebensmittelvergiftung im Ernstfall ist teurer als der Vorrat (Botulismus warn-7b!)</text>
