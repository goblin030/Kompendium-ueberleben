ont-weight="normal" fill="#1a1a1a">Schäfchenwolken ziehen schnell</text><text x="316" y="321.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">+ Temperatur fällt</text><text x="576" y="321.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kaltfront nähert sich</text><text x="56" y="383.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Starkes Tau am Morgen</text><text x="316" y="383.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">+ klarer Himmel danach</text><text x="576" y="383.375" font-family="sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Trockener Tag möglich</text><rect x="50" y="430" width="700" height="50" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="459.9" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Zwei-Zeichen-Regel: nie nach einem einzelnen Zeichen entscheiden – konservativ bleiben</text><ellipse cx="660" cy="120" rx="34" ry="22" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="660" y="158" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Cirrus</text><circle cx="120" cy="380" r="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><path d="M94 380 a26 26 0 1 0 52 0" fill="none" stroke="#1a1a1a" stroke-width="2"/><text x="120" y="442" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Halo um Sonne</text>
