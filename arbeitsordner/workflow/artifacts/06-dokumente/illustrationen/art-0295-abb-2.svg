<rect x="60" y="180" width="165" height="110" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="142.5" y="230.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">1. Hände waschen</text><text x="142.5" y="247.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">alle, mit eigenem Wasser</text><line x1="225" y1="235" x2="245" y2="235" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="245" y="180" width="165" height="110" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="327.5" y="230.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">2. Ehrenplatz zuerst</text><text x="327.5" y="247.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Gast/Ältester zuerst bedienen</text><line x1="410" y1="235" x2="430" y2="235" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="430" y="180" width="165" height="110" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="512.5" y="230.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">3. Reihum</text><text x="512.5" y="247.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">im Uhrzeigersinn, gleiche Portionen</text><line x1="595" y1="235" x2="615" y2="235" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="615" y="180" width="165" height="110" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="697.5" y="230.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">4. Reste</text><text x="697.5" y="247.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">in die Mitte, für später/andere</text><rect x="340" y="340" width="120" height="60" fill="#b8bec6" stroke="#1a1a1a" stroke-width="2.5" rx="6"/><line x1="334" y1="344" x2="340" y2="344" stroke="#1a1a1a" stroke-width="2.5"/><line x1="466" y1="344" x2="460" y2="344" stroke="#1a1a1a" stroke-width="2.5"/><line x1="336" y1="340" x2="464" y2="340" stroke="#1a1a1a" stroke-width="3"/><path d="M344 340 Q 400 328 456 340" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><circle cx="400" cy="327" r="3" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/><text x="400" y="440" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Speisen in der Mitte – aus der Mitte schöpfen</text>
