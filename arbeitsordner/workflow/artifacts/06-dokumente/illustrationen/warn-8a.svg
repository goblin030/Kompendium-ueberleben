<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Warngrafik warn-8a: Tetanus (Wundstarrkrampf)">
<title>Warngrafik warn-8a: Tetanus (Wundstarrkrampf)</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#6e6e6e" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#8a8a8a" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#6e6e6e"/></pattern>
<pattern id="wtr" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#a8cbe4"/><path d="M0 8 q 6 -5 12 0 t 12 0" fill="none" stroke="#3f6f96" stroke-width="1.4"/></pattern>
</defs>
<rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
<rect x="8" y="8" width="784" height="544" fill="#f6e3d3" stroke="#bd531a" stroke-width="6"/>
<text x="28" y="42" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#bd531a">warn-8a</text>
<text x="28" y="68" font-family="sans-serif" font-size="19" text-anchor="start" font-weight="bold" fill="#1a1a1a">Tetanus (Wundstarrkrampf)</text>
<line x1="28" y1="80" x2="772" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M64 100 L112 182 L16 182 z" fill="#bd531a" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
<text x="64" y="168" font-family="sans-serif" font-size="36" text-anchor="middle" font-weight="bold" fill="#ffffff">!</text>
<text x="150" y="212" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">Risikowunden (verschmutzt/tief/Stich/Biss/Quetschung/Verbrennung/Erfrierung/nekrotisch): ausgiebig spülen, Fremdkörper entfernen, OFFEN halten – nie zunähen</text>
<text x="150" y="240" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">· Booster (STIKO): letzte Impfung &gt; 10 Jahre her → nachholen · bei Risikowunde &gt; 5 Jahre → nachholen · TIG postexpositionell nur ärztlich</text>
<text x="150" y="268" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">· Impfstoff kühlkettenpflichtig 2–8 °C · nur gesottenes/abgekochtes Wasser zur Wundspülung (Abb. 2.9)</text>
<text x="150" y="296" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">· Symptome: Kieferklemme, Muskelkrämpfe – lebensgefährlich, sofort Arzt!</text>
<line x1="28" y1="512" x2="772" y2="512" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="534" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Warngrafik warn-8a – B8 2.2: Risikowunden offen halten, Booster-Regeln, Impfstoff 2–8 °C.</text>
<text x="772" y="534" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Warngrafik</text>
</svg>