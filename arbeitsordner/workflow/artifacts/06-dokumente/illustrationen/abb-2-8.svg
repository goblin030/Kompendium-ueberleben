<pattern id="wood" width="26" height="10" patternUnits="userSpaceOnUse"><rect width="26" height="10" fill="#c19a6b"/><path d="M0 3 q 6 -2 13 0 t 13 0 M0 7 q 7 2 13 0 t 13 0" fill="none" stroke="#7a5a3a" stroke-width="0.9"/></pattern>
<pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#b5d1a0"/><path d="M2 12 L4 4 M6 12 L7 2 M10 12 L9 6" stroke="#6e6e6e" stroke-width="0.9"/></pattern>
<pattern id="fabric" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#e2e2e2"/><path d="M0 0 L6 6 M6 0 L0 6" stroke="#8a8a8a" stroke-width="0.7"/></pattern>
<pattern id="metal" width="20" height="6" patternUnits="userSpaceOnUse"><rect width="20" height="6" fill="#b8bec6"/><path d="M0 1.5 h20 M0 4.5 h20" stroke="#6e747e" stroke-width="0.7"/></pattern>
