<ellipse cx="180" cy="250" rx="80" ry="46" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="180" cy="250" r="14" fill="url(#dots)" stroke="#1a1a1a" stroke-width="1.5"/><rect x="330" y="120" width="210" height="54" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="435" y="151.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">1. Rötung um die Wunde</text><rect x="560" y="120" width="210" height="54" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="665" y="151.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">2. zunehmende Schmerzen</text><rect x="330" y="190" width="210" height="54" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="435" y="221.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">3. Wärme/Schwellung</text><rect x="560" y="190" width="210" height="54" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="665" y="221.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">4. Eiterausfluss (gelblich)</text><rect x="330" y="260" width="210" height="54" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="435" y="291.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">5. Fieber/Lymphknoten geschwollen</text><rect x="90" y="400" width="620" height="56" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="432.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Bei Eiterzeichen: Wunde spülen, offen halten, Fieber messen (Abb. 8.7) – Antibiotika nur bei klarer Indikation (8.1)</text>
