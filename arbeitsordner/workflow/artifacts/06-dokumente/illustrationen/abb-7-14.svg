<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Abb. 7.14 – Einkochen situativ: pH-Fälle im Detail – Wasserbad nur sauer, low-acid nur Druckkocher (Ergänzung zu Abb. 7.7, warn-7b).">
<title>Abb. 7.14: Einkochen situativ: pH-Fälle im Detail – Wasserbad nur sauer, low-acid nur Druckkocher (Ergänzung zu Abb. 7.7, warn-7b).</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#8c8c8c" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#bfbfbf" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#8c8c8c"/></pattern>
</defs>
<rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">Abb. 7.14</text>
<line x1="28" y1="52" x2="872" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="40" y="90" width="240" height="60" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="160" y="124.9" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1a1a1a">pH messen (Streifen)</text><line x1="290" y1="120" x2="340" y2="120" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><rect x="350" y="80" width="240" height="60" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="470" y="105.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">pH ≤ 4,6: Obst, sauer</text><text x="470" y="122.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">z. B. Äpfel, Tomaten, Beeren</text><rect x="350" y="160" width="260" height="60" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="480" y="185.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">pH &gt; 4,6: low-acid</text><text x="480" y="202.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Fleisch, Gemüse, Bohnen, Mais</text><line x1="590" y1="110" x2="640" y2="110" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><line x1="610" y1="190" x2="640" y2="210" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><rect x="650" y="70" width="220" height="80" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="760" y="97.525" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">WASSERBAD 100 °C</text><text x="760" y="114.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Gläser 30–40 min</text><text x="760" y="130.525" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">nur bei pH ≤ 4,6 (gemessen)</text><rect x="650" y="170" width="230" height="110" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="765" y="204.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">DRUCK KOCHER 116–121 °C</text><text x="765" y="220.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">10 psi bis 300 m, 15 psi darüber</text><text x="765" y="237.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Zeiten nach NCHFP-Tabelle</text><text x="765" y="253.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Fleisch/Gemüse: Minuten–Stunden</text><rect x="40" y="280" width="820" height="90" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="320.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Öl-Einlagen: nur gesäuert (pH &lt; 4,6) oder vollständig getrocknet, kühl, Frist in Tagen · gewölbter Deckel/Schwall = ungeöffnet wegwerfen (Botulismus)</text><text x="450" y="337.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Kaltgeräucherter Fisch allein nicht haltbar (Typ E) – zusätzlich salzen/trocknen</text><rect x="40" y="400" width="820" height="60" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="434.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Situativ: wenig Zeit + viel Obst → Wasserbad ok (sauer) · Fleisch/Gemüse immer Druckkocher – Wasserbad tötet Sporen NICHT (warn-7b)</text><rect x="40" y="490" width="820" height="50" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="519.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Dokumentieren: pH-Wert, Methode, Zeit pro Glas ins Einkoch-Protokoll (Anhang B7)</text>
<line x1="28" y1="552" x2="872" y2="552" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="574" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Einkochen situativ: pH-Fälle im Detail – Wasserbad nur sauer, low-acid nur Druckkocher (Ergänzung zu Abb. 7.7, warn-7b).</text>
<text x="872" y="574" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Band 7</text>
</svg>