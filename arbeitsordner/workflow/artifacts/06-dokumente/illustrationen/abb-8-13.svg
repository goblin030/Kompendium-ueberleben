ere, Handschuhe</text><text x="306" y="320.675" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Medikamente</text><text x="456" y="320.675" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Fiebersenkend, Schmerz, Durchfall – Beipackzettel</text><text x="306" y="362.675" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Antibiotika</text><text x="456" y="362.675" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">nur bei klarer bakterieller Indikation – volle Kursdauer, Allergie beachten</text><text x="306" y="404.675" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Impfpass &amp; Doku</text><text x="456" y="404.675" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kopie Impfpass, Notfallkontakte, Protokollblatt</text><text x="306" y="446.675" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wasser &amp; Pflege</text><text x="456" y="446.675" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Seife, Desinfektion, Sonnenschutz</text><rect x="90" y="440" width="620" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="466.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Konsistent mit Traglast (Abb. 1.23) – Mappe wiegt mit &lt; 3 kg, griffbereit, wasserdicht verpackt</text>
