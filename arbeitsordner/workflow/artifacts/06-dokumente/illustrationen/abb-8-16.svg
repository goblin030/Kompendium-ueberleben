<rect x="40" y="100" width="400" height="150" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/><text x="60" y="130" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Pflanze (warn-5)</text><text x="60" y="154" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4d4d4d">Tollkirsche/Schierling…</text><text x="60" y="184" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Giftnotruf 116 123 · Reste sichern · kein Erbrechen (Abb. 8.10)</text><text x="60" y="206" font-family="sans-serif" font-size="9.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">generell: KEIN induziertes Erbrechen (Ausnahme nur nach Giftnotruf)</text><rect x="470" y="100" width="400" height="150" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/><text x="490" y="130" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Pilz (warn-5b)</text><text x="490" y="154" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4d4d4d">Knollenblätterpilz…</text><text x="490" y="184" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Notarzt! Amatoxine hitzestabil · Pilz + Erbrochenes sichern</text><text x="490" y="206" font-family="sans-serif" font-size="9.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">generell: KEIN induziertes Erbrechen (Ausnahme nur nach Giftnotruf)</text><rect x="40" y="270" width="400" height="150" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5"/><text x="60" y="300" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Speise (warn-7b)</text><text x="60" y="324" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4d4d4d">Botulismus-Verdacht</text><text x="60" y="354" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Notarzt! gewölbter Deckel = weggeworfen, aber Verdacht melden</text><text x="60" y="376" font-family="sans-serif" font-size="9.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">generell: KEIN induziertes Erbrechen (Ausnahme nur nach Giftnotruf)</text><rect x="470" y="270" width="400" height="150" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5"/><text x="490" y="300" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">Tierbiss/-stich</text><text x="490" y="324" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4d4d4d">Schlange/Biss, Insekt</text><text x="490" y="354" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Ruhe, Hochlagern, Druckverband nur bei Blutung · Anaphylaxie: 112</text><text x="490" y="376" font-family="sans-serif" font-size="9.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">generell: KEIN induziertes Erbrechen (Ausnahme nur nach Giftnotruf)</text><rect x="40" y="460" width="820" height="50" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="489.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">116 123 (DE) · +353 1 809 2166 (IE) · 112 (EU) · Aktivkohle nur nach Rücksprache · Bewusstsein/Atem beobachten · stabile Seitenlage</text>
