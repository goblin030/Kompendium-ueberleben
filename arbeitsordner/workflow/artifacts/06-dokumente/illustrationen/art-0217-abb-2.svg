<text x="250" y="82" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Material + Maße</text><text x="84" y="136" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">✓</text><text x="106" y="128" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Topf, Form (Holzkiste), Rührlöffel, Asche</text><text x="106" y="144" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">(Ofen-Asche: 2 Eimer</text><text x="84" y="194" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">✓</text><text x="106" y="186" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Verhältnis: ~1 Pfund (500 g) Fett → ~500 g Seife;</text><text x="106" y="202" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Lauge 0,5 l </text><text x="690" y="82" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Maß-Skizze (Schnitt)</text><text x="690" y="410" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">500 g</text><text x="738" y="294" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">0.5 l</text><text x="695" y="396" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">weitere Maße: 10 l</text><text x="574" y="234" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#1a1a1a">Klinge</text><text x="816" y="294" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Griff</text><text x="450" y="488.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Maße direkt aus dem Artikel – Maßkette mit Pfeilen + Werten; vo