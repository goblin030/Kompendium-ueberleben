<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">ART-0117 · Abb. 1</text>
<text x="400" y="82" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wie halte ich den Wärmehaushalt mit Schichten?</text><rect x="320.3" y="109.2" width="9.7" height="14.0" fill="#ffffff" rx="2" data-halo="1" /><text x="328" y="119" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1a1a1a">3</text><text x="335" y="126" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1a1a1a">2</text><text x="342" y="133" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1a1a1a">1</text><text x="81" y="139" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="105" y="140" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Innenschicht trocken anziehen; bei Nässe</text><text x="105" y="157" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">sofort wechseln (siehe ART-0133).</text><text x="511" y="139" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="535" y="140" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Isolierschicht darüber — Wolle wärmt auch</text><text x="535" y="157" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">feucht (Crimp-Luftpolster).</text><text x="81" y="281" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="105" y="282" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Außenschicht winddicht schließen, aber</text><text x="105" y="299" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Feuchtigkeitsauslass offen lassen.</text><text x="511" y="281" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="535" y="282" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Bei Arbeit eine Schicht weniger tragen; in der</text><text x="535" y="299" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Pause trockene Schicht an den Leib.</text><text x="81" y="423" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text><text x="105" y="424" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wind brechen, bevor er die Schulter trifft</text><text x="105" y="441" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">(Lee siehe ART-0134).</text><rect x="58.0" y="493.0" width="105.7" height="14.5" fill="#ffffff" rx="2" data-halo="1" /><text x="60" y="503.1" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Detail Schritt 1:</text><rect x="304.0" y="494.2" width="324.3" height="14.0" fill="#ffffff" rx="2" data-halo="1" /><text x="306" y="504.0" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Innenschicht trocken anziehen; bei Nässe sofort wechseln</text><text x="60" y="590" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#4d4d4d" />
<text x="28" y="574" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">ART-0117 – Schrittfolge: Wie halte ich den Wärmehaushalt mit Schichten?</text>
<text x="772" y="574" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch</text>
</svg>