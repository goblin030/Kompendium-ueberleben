<ellipse cx="200" cy="240" rx="90" ry="50" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="180" cy="230" r="6" fill="#949494" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="220" cy="250" r="5" fill="#949494" stroke="#1a1a1a" stroke-width="1.5"/><path d="M150 166.7 C 152.09 169.56 151.43 171.54 150 172.09 C 148.57 171.54 147.91 169.56 150 166.7 Z" fill="#6b97bd" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="149.34" cy="170.44" rx="0.385" ry="0.66" fill="#ffffff" stroke="none"/><path d="M200 156.7 C 202.09 159.56 201.43 161.54 200 162.09 C 198.57 161.54 197.91 159.56 200 156.7 Z" fill="#6b97bd" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="199.34" cy="160.44" rx="0.385" ry="0.66" fill="#ffffff" stroke="none"/><path d="M250 168.7 C 252.09 171.56 251.43 173.54 250 174.09 C 248.57 173.54 247.91 171.56 250 168.7 Z" fill="#6b97bd" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="249.34" cy="172.44" rx="0.385" ry="0.66" fill="#ffffff" stroke="none"/><text x="200" y="320" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">ausgiebig spülen – nur gesottenes/abgekochtes Wasser</text><line x1="320" y1="240" x2="420" y2="240" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="370" y="226" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Fremdkörper entfernen</text><rect x="440" y="190" width="200" height="90" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="540" y="230.925" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Risikowunden OFFEN halten:</text><text x="540" y="246.425" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">verschmutzt · tief · Stich · Biss · Quetschung · Verbrennung · Erfrierung · nekrotisch</text><rect x="680" y="110" width="200" height="90" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="780" y="143.175" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Tetanus-Booster (STIKO):</text><text x="780" y="158.675" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">&gt; 10 Jahre letzte Impfung → nachholen</text><text x="780" y="174.175" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">&gt; 5 Jahre bei Risikowunde → nachholen</text><rect x="680" y="220" width="200" height="80" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="780" y="263.675" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">TIG postexpositionell nur ärztlich · Impfstoff kühl 2–8 °C (Kühlkette!)</text><rect x="680" y="320" width="200" height="60" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="780" y="338.175" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Naht nur bei sauberer</text><text x="780" y="353.675" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Schnittwunde &lt; 6–12 h,</text><text x="780" y="369.175" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">durch erfahrene Person</text><rect x="60" y="400" width="800" height="90" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="460" y="449.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">WARN (warn-8a): Wundstarrkrampf – Muskelkrämpfe, Kieferklemme, lebensgefährlich. Booster-Regeln oben einhalten, Impfpass checken, Risikowunden nie zunähen.</text>
