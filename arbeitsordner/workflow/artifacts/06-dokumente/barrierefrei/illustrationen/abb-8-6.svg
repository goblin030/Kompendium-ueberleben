<?xml version="1.0" encoding="UTF-8"?>
<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Abb. 8.6 – Tinkturen, Salben, Öle: Öl-Auszug nur gesäuert (pH &lt; 4,6) oder vollständig getrocknet – Datum am Gefäß (Konzept 3.3, Botulismus-Verweis ).">
<title>Abb. 8.6: Tinkturen, Salben, Öle: Öl-Auszug nur gesäuert (pH &lt; 4,6) oder vollständig getrocknet – Datum am Gefäß (Konzept 3.3, Botulismus-Verweis ).</title>
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#1a1a1a"/></marker>
<marker id="ahs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10 0 L0 4 L10 8 z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#6e6e6e" stroke-width="1.6"/></pattern>
<pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0 L8 8 M8 0 L0 8" stroke="#8a8a8a" stroke-width="1"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#6e6e6e"/></pattern>
<pattern id="wtr" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#a8cbe4"/><path d="M0 8 q 6 -5 12 0 t 12 0" fill="none" stroke="#3f6f96" stroke-width="1.4"/></pattern>
</defs>
<rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">Abb. 8.6</text>
<line x1="28" y1="52" x2="772" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="140" y="200" width="60" height="120" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><rect x="140" y="240" width="60" height="80" fill="url(#dots)" stroke="none"/><text x="170" y="350" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Tinktur (Alkohol)</text><rect x="260" y="200" width="60" height="120" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><rect x="260" y="250" width="60" height="70" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1"/><text x="290" y="350" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Salbe (Fett+Wachs)</text><rect x="380" y="200" width="60" height="120" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2.5" rx="8"/><rect x="380" y="250" width="60" height="70" fill="url(#hatch)" stroke="none"/><text x="410" y="350" font-family="sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Öl-Auszug</text><rect x="500" y="140" width="260" height="120" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="630" y="179.85" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Öl-Auszug ohne Säure = Botulismus-Falle:</text><text x="630" y="195.85" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">nur mit pH &lt; 4,6 (gesäuert)</text><text x="630" y="211.85" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">oder vollständig getrocknetes Gut</text><text x="630" y="227.85" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">· Datum am Gefäß · kühl lagern</text><rect x="90" y="420" width="620" height="56" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="452.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Gelb: Tinkturen/Salben nur mit klarem Rezept und Dosierung – „erst die Grenze, dann die Gabe“ (B5 6.2)</text>
<line x1="28" y1="472" x2="772" y2="472" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="494" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Tinkturen, Salben, Öle: Öl-Auszug nur gesäuert (pH &lt; 4,6) oder vollständig getrocknet – Datum am Gefäß (Konzept 3.3, Botulismus-Verweis ).</text>
<text x="772" y="494" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Band 8</text>
