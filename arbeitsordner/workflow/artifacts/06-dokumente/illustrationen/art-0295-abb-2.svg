<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">ART-0295 · Abb. 2</text>
<text x="142.5" y="230.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">1. Hände waschen</text><text x="142.5" y="247.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">alle, mit eigenem Wasser</text><text x="327.5" y="230.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">2. Ehrenplatz zuerst</text><rect x="238.8" y="237.2" width="177.4" height="14.5" fill="#ffffff" rx="2" data-halo="1" /><text x="327.5" y="247.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Gast/Ältester zuerst bedienen</text><text x="512.5" y="230.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">3. Reihum</text><rect x="405.9" y="237.2" width="213.3" height="14.5" fill="#ffffff" rx="2" data-halo="1" /><text x="512.5" y="247.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">im Uhrzeigersinn, gleiche Portionen</text><text x="697.5" y="230.775" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">4. Reste</text><rect x="602.8" y="237.2" width="189.4" height="14.5" fill="#ffffff" rx="2" data-halo="1" /><text x="697.5" y="247.275" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">in die Mitte, für später/andere</text><text x="400" y="440" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Speisen in der Mitte – aus der Mitte schöpfen</text>
<text x="28" y="494" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Servierreihenfolge beim gemeinsamen Mahl (ART-0295).</text>
<text x="772" y="494" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch</text>
