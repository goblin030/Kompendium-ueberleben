" stroke-width="1" />
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">ART-0236 · Abb. 1</text>
<text x="400" y="82" font-family="sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wie kühle ich Medikamente und Insulin ohne Strom (2-8 °C)?</text><text x="328" y="119" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1a1a1a">3</text><text x="335" y="126" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1a1a1a">2</text><text x="342" y="133" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1a1a1a">1</text><text x="81" y="139" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><text x="105" y="140" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kühlbox an den kühlsten Ort stellen;</text><text x="105" y="157" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Thermometer hineinlegen.</text><text x="511" y="139" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><text x="535" y="140" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Täglich Temperatur prüfen und am Blatt</text><text x="535" y="157" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">notieren; Verfallsdaten im Inventar</text><text x="535" y="174" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">(ART-0243).</text><text x="81" y="281" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><text x="105" y="282" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Insulin: ungeöffnet kühl; angebrochen Datum</text><text x="105" y="299" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">notieren, nach 28 Tagen (≤ 30 °C) verwerfen.</text><text x="511" y="281" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><text x="535" y="282" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Bei Blackout: Medikamentenbestand sofort</text><text x="535" y="299" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">prüfen (mind. 14 T, ART-0253);</text><text x="535" y="316" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Apotheke/Rettungslei</text><text x="81" y="423" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text><text x="105" y="424" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Verdunstungskühlung nur als Übergang für</text><text x="105" y="441" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Impfstoff — nie als Dauerlösung.</text><text x="60" y="564" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Detail Schritt 1:</text><text x="306" y="560" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kühlbox an den kühlsten Ort stellen; Thermometer</text><text x="60" y="590" font-family="sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#4d4d4d" />
<text x="28" y="574" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">ART-0236 – Schrittfolge: Wie kühle ich Medikamente und Insulin ohne Strom (2-8 °C)?</text>
