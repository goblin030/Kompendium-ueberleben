<pattern id="metal" width="20" height="6" patternUnits="userSpaceOnUse"><rect width="20" height="6" fill="#b8bec6"/><path d="M0 1.5 h20 M0 4.5 h20" stroke="#6e747e" stroke-width="0.7"/></pattern>
<pattern id="stone" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#949494"/><circle cx="3" cy="4" r="1.1" fill="#6e6e6e"/><circle cx="9" cy="10" r="1.3" fill="#6e6e6e"/><path d="M2 11 L6 8 L12 9" stroke="#6e6e6e" stroke-width="0.7" fill="none"/></pattern>
</defs>
<rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
<text x="28" y="38" font-family="sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1a1a1a">Abb. 2.18</text>
<line x1="28" y1="52" x2="772" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="280" y="90" width="240" height="56" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="122.9" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wasserbefund (Abb. 5.1 B2)</text><rect x="50" y="170" width="750" height="434" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><line x1="250" y1="170" x2="250" y2="604" stroke="#1a1a1a" stroke-width="1"/><line x1="630" y1="170" x2="630" y2="604" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="232" x2="800" y2="232" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="294" x2="800" y2="294" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="356" x2="800" y2="356" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="418" x2="800" y2="418" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="480" x2="800" y2="480" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="542" x2="800" y2="542" stroke="#1a1a1a" stroke-width="1"/><text x="56" y="205.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Befund</text><text x="256" y="205.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Methode</text><text x="636" y="205.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Merke</text><text x="56" y="267.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">klar (&lt; 30 NTU), warm</text><text x="256" y="267.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">SODIS 6 h (Abb. 2.10) ODER 1 min kochen (Abb. 2.9)</text><text x="636" y="267.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">einfach, zuverlässig</text><text x="56" y="329.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">klar, kalt</text><text x="256" y="329.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">kochen 1 min – oder SODIS länger</text><text x="636" y="329.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Kälte verlangsamt SODIS</text><text x="56" y="391.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">trüb (&gt; 30 NTU)</text><text x="256" y="391.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">erst klären (Abb. 2.8), dann kochen / Chlor doppelt 60 min (Abb. 2.13)</text><text x="636" y="391.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Trübung schützt Keime</text><text x="56" y="453.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">trüb + kalt</text><text x="256" y="453.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">klären + Chlor 4 Tropfen/L, 60 min – Kinder-Dosis nicht halbieren </text><text x="636" y="453.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">im Zweifel kochen</text><text x="56" y="515.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">salzig / chemisch</text><text x="256" y="515.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Destillation (Abb. 2.12, Notbehelf) – Kochen hilft NICHT </text><text x="636" y="515.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Salz/Chemie bleiben</text><text x="56" y="577.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Blaualgen-Verdacht</text><text x="256" y="577.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">verwerfen – weder kochen noch filtern hilft </text><text x="636" y="577.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Microcystin hitzestabil</text><line x1="400" y1="146" x2="400" y2="168" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/><line x1="400" y1="146" x2="400" y2="168" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/><line x1="400" y1="146" x2="400" y2="168" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/><line x1="400" y1="146" x2="400" y2="168" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/><line x1="400" y1="146" x2="400" y2="168" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/><line x1="400" y1="146" x2="400" y2="168" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#ah)"/><rect x="50" y="618" width="700" height="46" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="645.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Grundsatz: im Zweifel immer abkochen (Abb. 2.9) – Kochen tötet Keime, aber keine Chemie </text>
<line x1="28" y1="552" x2="772" y2="552" stroke="#1a1a1a" stroke-width="1"/>
<text x="28" y="574" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1a1a1a">Aufbereitung je Wasserbefund situativ: klar/trüb/kalt/salzig → passende Methode (Ergänzung zu Abb. 2.8–2.13).</text>
<text x="772" y="574" font-family="sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#4d4d4d">Das Überlebenbuch · Band 2</text>
</svg>