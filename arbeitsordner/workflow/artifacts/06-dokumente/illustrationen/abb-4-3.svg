<rect x="50" y="100" width="760" height="372" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><line x1="220" y1="100" x2="220" y2="472" stroke="#1a1a1a" stroke-width="1"/><line x1="420" y1="100" x2="420" y2="472" stroke="#1a1a1a" stroke-width="1"/><line x1="620" y1="100" x2="620" y2="472" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="162" x2="810" y2="162" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="224" x2="810" y2="224" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="286" x2="810" y2="286" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="348" x2="810" y2="348" stroke="#1a1a1a" stroke-width="1"/><line x1="50" y1="410" x2="810" y2="410" stroke="#1a1a1a" stroke-width="1"/><text x="56" y="135.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Material</text><text x="226" y="135.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Eigenschaft</text><text x="426" y="135.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Einsatz</text><text x="626" y="135.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Achtung</text><text x="56" y="197.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Ried / Stroh</text><text x="226" y="197.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">leicht, isolierend</text><text x="426" y="197.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Dach, mind. 45° Neigung</text><text x="626" y="197.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Feuer! – Abstand halten (B3)</text><text x="56" y="259.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Bretter / Bohlen</text><text x="226" y="259.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">stabil, schwer</text><text x="426" y="259.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Wand, Boden</text><text x="626" y="259.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Trocknung ~1 J je Daumen </text><text x="56" y="321.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Rinde (Birke/Fichte)</text><text x="226" y="321.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">leicht, biegsam</text><text x="426" y="321.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Dachdeckung 30°, Wände</text><text x="626" y="321.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">frisch vom Totholz (B5 7.2)</text><text x="56" y="383.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Stein / Lehm</text><text x="226" y="383.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">schwer, speichert Wärme</text><text x="426" y="383.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Sockel, Ofen, Fundament</text><text x="626" y="383.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">trocken halten</text><text x="56" y="445.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Laub / Gras</text><text x="226" y="445.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">weich, isolierend</text><text x="426" y="445.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Füllung Wand/Schlafplatz</text><text x="626" y="445.025" font-family="sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1a1a1a">Brandgefahr – nicht am Feuer</text><rect x="50" y="490" width="700" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="516.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Holz quillt nass – Verbindungen mit Spiel einplanen; Metall dehnt sich in der Sonne</text>
