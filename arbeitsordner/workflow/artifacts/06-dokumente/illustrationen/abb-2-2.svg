<text x="400" y="96" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4d4d4d">pro Person und Tag</text><text x="280" y="158" font-family="sans-serif" font-size="13.5" text-anchor="end" font-weight="bold" fill="#1a1a1a">Trinkminimum (BBK)</text><rect x="290" y="130" width="65" height="44" fill="#a6a6a6" stroke="#1a1a1a" stroke-width="2"/><text x="367" y="158" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">2–3 l</text><text x="437" y="158" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4d4d4d">Kinder 1–1,5 l</text><text x="280" y="236" font-family="sans-serif" font-size="13.5" text-anchor="end" font-weight="bold" fill="#1a1a1a">Fieber / schwere Leistung</text><rect x="290" y="208" width="130" height="44" fill="#c9c9c9" stroke="#1a1a1a" stroke-width="2"/><text x="432" y="236" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">4–6 l</text><text x="502" y="236" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4d4d4d">zusätzlich</text><text x="280" y="314" font-family="sans-serif" font-size="13.5" text-anchor="end" font-weight="bold" fill="#1a1a1a">Notfallstandard (WHO)</text><rect x="290" y="286" width="227.5" height="44" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2"/><text x="529.5" y="314" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">7,5–10 l</text><text x="599.5" y="314" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4d4d4d">Trinken + Kochen + Hygiene</text><text x="280" y="392" font-family="sans-serif" font-size="13.5" text-anchor="end" font-weight="bold" fill="#1a1a1a">Haushaltsstandard</text><rect x="290" y="364" width="455" height="44" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="757" y="392" font-family="sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1a1a1a">15–20 l</text><text x="827" y="392" font-family="sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#4d4d4d">WHO/Sphere Basisstandard</text><rect x="120" y="440" width="560" height="46" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="467.375" font-family="sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">BBK-Trinkwert (2 l) ist das reine Trinkminimum – nicht der Gesamtbedarf</text>
