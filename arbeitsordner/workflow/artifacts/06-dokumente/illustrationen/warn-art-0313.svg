<text x="150" y="215" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">· Wert-Korridor: Stunde Arbeit / Seltenheit / Not – aber mit oberer Grenze</text>
<text x="150" y="242" font-family="sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1a1a1a">· Krasses Missverhältnis in der Ausbeutung = Wucher: strafbar (§ 291 StGB), Vertrag nichtig (§ 138 Abs. 2 BGB)</text>
