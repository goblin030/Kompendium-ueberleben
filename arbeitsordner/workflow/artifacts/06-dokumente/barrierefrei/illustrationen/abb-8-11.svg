<ellipse cx="280" cy="280" rx="120" ry="55" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="3"/><ellipse cx="320" cy="270" rx="30" ry="20" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><path d="M140 160 q 10 60 0 120 M170 150 q 14 70 0 140 M110 170 q 8 50 0 100" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="140" y="320" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a1a1a">kühles fließendes Wasser 10–20 min</text><rect x="480" y="140" width="280" height="70" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><text x="620" y="170.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">NIE Fett, Butter, Öl auf die Brandwunde –</text><text x="620" y="187.7" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wärme staut sich, Infektion steigt</text><rect x="480" y="230" width="280" height="60" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="620" y="264.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">NIE Eis direkt auf die Haut – Erfrierung!</text><rect x="90" y="400" width="620" height="56" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="400" y="432.2" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Verbrühungsgrenze 55 °C (Abb. 1.27) · Blasen nicht aufstechen · lockerer Verband · Schockzeichen beachten</text>
