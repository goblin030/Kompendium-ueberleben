<rect x="40" y="100" width="260" height="330" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="170" y="122" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Schneehöhle (Abb. 4.5)</text><path d="M60 380 C 60 260 200 220 300 380 Z" fill="url(#dots)" stroke="#1a1a1a" stroke-width="2"/><rect x="70" y="330" width="60" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="180" y="420" font-family="sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Kugelprobe, Luftloch, Podest</text><text x="180" y="440" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#4d4d4d">Wann: viel Schnee, wenig Zeit, 2 Personen</text><rect x="320" y="100" width="260" height="330" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="122" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Biwak mit Tarp</text><path d="M350 300 L450 240 L560 300 L560 380 L350 380 Z" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="455" cy="360" rx="60" ry="16" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="455" y="420" font-family="sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">Tarp als Dach, Seite offen zum Feuer</text><text x="455" y="440" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#4d4d4d">Wann: wenig Schnee, Tarp vorhanden, schnell</text><rect x="600" y="100" width="260" height="330" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="730" y="122" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Hütte / Unterstand (Abb. 4.6)</text><rect x="640" y="280" width="180" height="100" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="640,280 730,230 820,280" fill="#c9c9c9" stroke="#1a1a1a" stroke-width="2.5"/><text x="730" y="420" font-family="sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a">beste Wahl bei Zeit + Material</text><text x="730" y="440" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#4d4d4d">Wann: mehrere Tage, Baumaterial da</text><rect x="40" y="460" width="820" height="50" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/><text x="450" y="489.025" font-family="sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Reihenfolge bei Kälte: erst Wind-/Wetterschutz, dann Isolierung unten (Abb. 4.10), dann Schlafplatz · Einsturzrisiko Schneehöhle: zu zweit bauen</text>
